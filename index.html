<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAGON-GATE — Shop</title>
<meta name="description" content="Sfoglia il catalogo DRAGON-GATE: cerca, filtra per categoria, tag, taglia, colore e prezzo.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-nav"></div>

<main id="main">
  <div class="container">
    <div class="shop-header">
      <h1>Shop</h1>
      <div class="notice-bar">
        Questo sito è un catalogo informativo. Gli articoli non sono acquistabili direttamente qui.
      </div>
    </div>

    <div class="toolbar">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Cerca un articolo…" aria-label="Cerca un articolo">
      </div>
      <div class="select-field">
        <label class="sr-only" for="sortSelect">Ordina per</label>
        <select id="sortSelect">
          <option value="recenti">Più recenti</option>
          <option value="prezzo-asc">Prezzo crescente</option>
          <option value="prezzo-desc">Prezzo decrescente</option>
          <option value="nome-asc">Nome A-Z</option>
          <option value="nome-desc">Nome Z-A</option>
        </select>
      </div>
      <button class="btn btn-ghost filters-btn" id="openFiltersBtn">Filtri</button>
    </div>

    <div class="active-filters" id="activeFilters" hidden></div>
    <p class="results-count" id="resultsCount"></p>

    <div class="shop-layout">
      <aside class="filters-panel" aria-label="Filtri">
        <div id="filtersFormDesktop"></div>
      </aside>

      <div>
        <div class="grid" id="productGrid"></div>
        <div class="empty-state" id="emptyState" hidden>
          <h3>Nessun articolo trovato</h3>
          <p>Prova a modificare la ricerca o rimuovere alcuni filtri.</p>
          <button class="btn btn-primary" id="emptyResetBtn">Azzera filtri</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile filter drawer -->
  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-drawer-backdrop" id="filterDrawerBackdrop"></div>
    <div class="filter-drawer-panel">
      <div class="filter-drawer-head">
        <h2 style="font-family:var(--font-display); font-size:1.2rem;">Filtri</h2>
        <button class="mobile-menu-close" id="closeFiltersBtn" aria-label="Chiudi filtri">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="filtersFormMobile"></div>
    </div>
    <div class="filter-drawer-foot">
      <button class="btn btn-ghost btn-block" id="mobileResetBtn">Azzera</button>
      <button class="btn btn-primary btn-block" id="mobileApplyBtn">Mostra risultati</button>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
